<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Power11 Sweep the Floor — Validation Agent</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #ffffff; --surface: #f7f8fa; --border: #e5e7eb;
  --text: #1f2328; --muted: #57606a; --accent: #3b82d4;
  --pass-bg: #dcfce7; --pass-fg: #166534; --pass-border: #86efac;
  --fail-bg: #fee2e2; --fail-fg: #991b1b; --fail-border: #fca5a5;
  --warn-bg: #fff7ed; --warn-fg: #7c2d12; --warn-border: #fed7aa;
}
body {
  font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
  font-size: 14px; line-height: 1.6; color: var(--text);
  background: #f0f2f5; min-height: 100vh;
}
.app-header {
  background: #1f2328; color: #fff;
  padding: 14px 24px;
  display: flex; align-items: center; justify-content: space-between;
}
.app-header-left .logo { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; }
.app-header-left .subtitle { font-size: 12px; color: #9ca3af; margin-top: 2px; }
.header-reset-btn {
  background: transparent; color: #d1d5db; border: 1px solid #4b5563;
  border-radius: 6px; padding: 7px 16px; font-size: 13px; font-weight: 600;
  cursor: pointer; letter-spacing: 0.2px; transition: background 0.15s, color 0.15s;
  white-space: nowrap;
}
.header-reset-btn:hover { background: #374151; border-color: #6b7280; color: #fff; }
.reset-bottom-btn {
  display: block; width: 100%; padding: 11px;
  background: transparent; color: var(--muted); border: 1px solid var(--border);
  border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer;
  letter-spacing: 0.2px; transition: background 0.15s, color 0.15s; margin-top: 16px;
}
.reset-bottom-btn:hover { background: #f3f4f6; color: var(--text); }
.date-select {
  padding: 4px 10px; border: 1px solid var(--border); border-radius: 5px;
  font-size: 12.5px; font-weight: 600; cursor: pointer;
  background: #fff; color: var(--text);
}

.main { max-width: 860px; margin: 32px auto; padding: 0 16px 64px; }

.card { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 20px; overflow: hidden; }
.card-header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 12px 18px; font-weight: 600; font-size: 13.5px; }
.card-body { padding: 18px; }

/* Upload */
.upload-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 560px) { .upload-grid { grid-template-columns: 1fr; } }

.upload-zone {
  border: 2px dashed var(--border); border-radius: 8px;
  padding: 22px 14px; text-align: center; cursor: pointer;
  transition: border-color 0.15s, background 0.15s; position: relative;
}
.upload-zone:hover, .upload-zone.drag-over { border-color: var(--accent); background: #eff6ff; }
.upload-zone.loaded { border-color: var(--pass-border); background: #f0fdf4; }
.upload-zone input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
.upload-icon { font-size: 32px; margin-bottom: 8px; }
.upload-label { font-weight: 600; font-size: 13px; color: var(--text); }
.upload-hint  { font-size: 11.5px; color: var(--muted); margin-top: 3px; }
.upload-filename { font-size: 11.5px; color: var(--pass-fg); font-weight: 600; margin-top: 6px; word-break: break-all; min-height: 16px; }

.ref-note {
  margin-top: 14px; background: #eff6ff; border: 1px solid #bfdbfe;
  border-radius: 6px; padding: 10px 14px; font-size: 12.5px; color: #1e40af;
}
.ref-note strong { color: #1d4ed8; }

.run-btn {
  display: block; width: 100%; padding: 13px;
  background: #1f2328; color: #fff; border: none; border-radius: 8px;
  font-size: 14px; font-weight: 700; cursor: pointer; letter-spacing: 0.3px;
  transition: background 0.15s; margin-top: 16px;
}
.run-btn:hover:not(:disabled) { background: #374151; }
.run-btn:disabled { background: #9ca3af; cursor: not-allowed; }

/* Results */
#results { display: none; }
.spinner-wrap { text-align: center; padding: 24px; }
.spinner {
  display: inline-block; width: 32px; height: 32px;
  border: 3px solid var(--border); border-top-color: var(--accent);
  border-radius: 50%; animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.result-section { border: 1px solid var(--border); border-radius: 6px; margin-bottom: 14px; overflow: hidden; }
.result-header { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); }
.result-title { font-weight: 600; font-size: 13px; }
.result-body  { padding: 14px 16px; font-size: 13px; }

.badge { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 11.5px; font-weight: 700; letter-spacing: 0.4px; text-transform: uppercase; }
.badge-pass { background: var(--pass-bg); color: var(--pass-fg); }
.badge-fail { background: var(--fail-bg); color: var(--fail-fg); }

.field-row { display: flex; gap: 8px; margin-bottom: 5px; font-size: 13px; }
.field-lbl { color: var(--muted); min-width: 170px; flex-shrink: 0; }
.field-val { font-weight: 500; }
.green { color: var(--pass-fg); } .red { color: var(--fail-fg); }

table.res-table { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-top: 10px; }
table.res-table th { background: var(--surface); border: 1px solid var(--border); padding: 6px 9px; text-align: left; font-weight: 600; }
table.res-table td { border: 1px solid var(--border); padding: 6px 9px; }
table.res-table tr:nth-child(even) td { background: #fafafa; }

.checklist { list-style: none; padding: 0; }
.checklist li { display: flex; align-items: flex-start; gap: 8px; padding: 5px 0; border-bottom: 1px solid #f0f0f0; font-size: 13px; }
.checklist li:last-child { border-bottom: none; }
.ci { flex-shrink: 0; margin-top: 2px; }

.overall-box { border: 2px solid; border-radius: 8px; padding: 20px; margin-top: 20px; }
.overall-box.pass { border-color: var(--pass-border); background: #f0fdf4; }
.overall-box.fail { border-color: var(--fail-border); background: #fff5f5; }
.overall-title { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
.overall-rec   { font-size: 14px; font-weight: 600; margin-bottom: 10px; }
.overall-rec.pass-rec { color: var(--pass-fg); } .overall-rec.fail-rec { color: var(--fail-fg); }
.fail-reasons { margin-top: 12px; }
.fail-reasons h4 { font-size: 13px; font-weight: 700; margin-bottom: 6px; }
.fail-reasons ul { padding-left: 18px; font-size: 13px; line-height: 1.8; }

.info-box  { background: #f0fdf4; border: 1px solid var(--pass-border); border-radius: 5px; padding: 9px 13px; font-size: 13px; color: #14532d; margin-bottom: 10px; }
.warn-box  { background: var(--warn-bg); border: 1px solid var(--warn-border); border-radius: 5px; padding: 9px 13px; font-size: 13px; color: var(--warn-fg); margin-bottom: 10px; }

/* Download link in header */
.header-download-link {
  display: inline-flex; align-items: center; gap: 6px;
  color: #93c5fd; font-size: 12px; text-decoration: none;
  margin-top: 5px; cursor: pointer; background: none; border: none;
  padding: 0; font-family: inherit;
}
.header-download-link:hover { color: #bfdbfe; text-decoration: underline; }
/* Instructions card */
.instructions-card {
  background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
  margin-bottom: 20px; overflow: hidden;
}
.instructions-card-header {
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 11px 18px; font-weight: 600; font-size: 13.5px;
  display: flex; align-items: center; gap: 8px;
}
.instructions-card-body { padding: 16px 18px; }
.instructions-steps { list-style: none; padding: 0; margin: 0; }
.instructions-steps li {
  display: flex; gap: 12px; align-items: flex-start;
  padding: 7px 0; border-bottom: 1px solid #f0f0f0; font-size: 13px;
}
.instructions-steps li:last-child { border-bottom: none; }
.step-num {
  flex-shrink: 0; width: 22px; height: 22px; border-radius: 50%;
  background: #1f2328; color: #fff; font-size: 11px; font-weight: 700;
  display: flex; align-items: center; justify-content: center; margin-top: 1px;
}
.instructions-steps li span { line-height: 1.55; color: var(--text); }
.instructions-steps li span strong { color: #1f2328; }
/* Promotion notice in instructions */
.promo-note {
  margin-top: 12px; background: #eff6ff; border: 1px solid #bfdbfe;
  border-radius: 6px; padding: 9px 13px; font-size: 12.5px; color: #1e40af;
  display: flex; align-items: center; gap: 10px;
}
.page-footer { margin-top: 40px; padding-top: 12px; border-top: 1px solid var(--border); text-align: center; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>

<div class="app-header">
  <div class="app-header-left">
    <div class="logo">Power11 Sweep the Floor — Validation Agent</div>
    <div class="subtitle">Q4 2026 Promotion Eligibility Checker</div>
    <button class="header-download-link" onclick="downloadPromoDoc()">⬇ Promotion Letter &amp; Cert Template</button>
    <button class="header-download-link" onclick="downloadXlsx()" style="margin-top:3px;">⬇ Power 8 / 9 / 10 Eligibility List</button>
  </div>
  <button class="header-reset-btn" onclick="resetAll()" title="Clear all inputs and results">↺ Reset</button>
</div>

<div class="main">

  <div class="card">
    <div class="card-header">📂 Upload Files</div>
    <div class="card-body">

      <div class="upload-grid">

        <div class="upload-zone" id="zone-epr"
             ondragover="dragOver(event,'zone-epr')" ondragleave="dragLeave('zone-epr')" ondrop="dropFile(event,'epr')">
          <input type="file" accept=".htm,.html" onchange="loadFile(event,'epr')">
          <div class="upload-icon">🖥️</div>
          <div class="upload-label">ePricer Standard Report</div>
          <div class="upload-hint">.htm / .html</div>
          <div class="upload-filename" id="fn-epr">No file selected</div>
        </div>

        <div class="upload-zone" id="zone-cert"
             ondragover="dragOver(event,'zone-cert')" ondragleave="dragLeave('zone-cert')" ondrop="dropFile(event,'cert')">
          <input type="file" accept=".doc,.docx,.pdf" onchange="loadFile(event,'cert')">
          <div class="upload-icon">📄</div>
          <div class="upload-label">Certification Letter</div>
          <div class="upload-hint">.doc / .docx / .pdf</div>
          <div class="upload-filename" id="fn-cert">No file selected</div>
        </div>

      </div>

      <button class="run-btn" id="run-btn" onclick="runValidation()" disabled>
        ▶ Run Validation
      </button>
    </div>
  </div>

  <div id="results">
    <div id="spinner-wrap" class="spinner-wrap"><div class="spinner"></div></div>
    <div id="result-content" style="display:none;"></div>
  </div>

</div>

function downloadXlsx() {
  const bytes = atob(XLSX_B64);
  const buf = new Uint8Array(bytes.length);
  for (let i = 0; i < bytes.length; i++) buf[i] = bytes.charCodeAt(i);
  const blob = new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url;
  a.download = 'Power 8 9 and 10.xlsx';
  a.click();
  URL.revokeObjectURL(url);
}

          POWER9.find(x=>x.id.toUpperCase()===u) ||
          POWER10.find(x=>x.id.toUpperCase()===u) || {}).desc || '';
}

// ─────────────────────────────────────────────────────────────
// FILE STATE & RESET
// ─────────────────────────────────────────────────────────────
const files = { epr: null, cert: null };
let lastResults = null; // stored for date-override re-render

function dragOver(e, z) { e.preventDefault(); document.getElementById(z).classList.add('drag-over'); }
function dragLeave(z)   { document.getElementById(z).classList.remove('drag-over'); }
function dropFile(e, key) {
  e.preventDefault();
  document.getElementById('zone-'+key).classList.remove('drag-over');
  const f = e.dataTransfer.files[0];
  if (f) handleFile(f, key);
}
function loadFile(e, key) { if (e.target.files[0]) handleFile(e.target.files[0], key); }
function handleFile(f, key) {
  files[key] = f;
  document.getElementById('fn-'+key).textContent = f.name;
  document.getElementById('zone-'+key).classList.add('loaded');
  document.getElementById('run-btn').disabled = !(files.epr && files.cert);
}

function resetAll() {
  files.epr = null; files.cert = null; lastResults = null;
  document.getElementById('fn-epr').textContent  = 'No file selected';
  document.getElementById('fn-cert').textContent = 'No file selected';
  document.getElementById('zone-epr').classList.remove('loaded');
  document.getElementById('zone-cert').classList.remove('loaded');
  // Re-clone inputs to clear file selection
  ['zone-epr','zone-cert'].forEach(id => {
    const old = document.querySelector('#'+id+' input[type="file"]');
    const neo = old.cloneNode(true);
    old.replaceWith(neo);
  });
  document.getElementById('run-btn').disabled = true;
  document.getElementById('results').style.display = 'none';
  document.getElementById('result-content').innerHTML = '';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Called when user changes the Date dropdown in the cert letter table
function updateDateOverride(val) {
  if (!lastResults) return;
  const override = val === 'pass'; // true = PASS, false = FAIL
  const { meta, r1, r2, r3, r4, r5, eprText } = lastResults;
  // Clone r4 and override the Date field
  const r4x = Object.assign({}, r4, { fields: r4.fields.map(f => {
    if (f.isDateField) {
      const p = override;
      return Object.assign({}, f, {
        pass: p,
        error: p ? null : 'Date "'+f.value+'" manually marked as FAIL.',
      });
    }
    return f;
  })});
  r4x.blankFields = r4x.fields.filter(f=>!f.pass).map(f=>f.label);
  r4x.pass = r4x.blankFields.length === 0;
  document.getElementById('result-content').innerHTML = buildReport(meta, r1, r2, r3, r4x, r5, eprText);
  // Restore dropdown to the chosen value after re-render
  const sel = document.getElementById('date-override-select');
  if (sel) sel.value = val;
}

// ─────────────────────────────────────────────────────────────
// MAIN RUNNER
// ─────────────────────────────────────────────────────────────
async function runValidation() {
  const resultsDiv = document.getElementById('results');
  const spinnerWrap = document.getElementById('spinner-wrap');
  const contentDiv  = document.getElementById('result-content');

  resultsDiv.style.display = 'block';
  spinnerWrap.style.display = 'block';
  contentDiv.style.display  = 'none';
  contentDiv.innerHTML = '';

  // Scroll to results
  resultsDiv.scrollIntoView({ behavior: 'smooth' });

  try {
    const eprText  = await readAsText(files.epr);
    const certDoc  = await readCertFile(files.cert);  // { text, imageCount }
    const meta     = extractMeta(eprText);

    const r1 = validateBidType(eprText);
    const r2 = validatePromotion(eprText);
    const r3 = validatePower11Config(eprText);
    const r4 = validateCertLetter(certDoc.text, meta, certDoc.imageCount);
    const r5 = validateLegacyMachines(r4.machines);

    lastResults = { meta, r1, r2, r3, r4, r5, eprText };  // save for date-override re-render

    spinnerWrap.style.display = 'none';
    contentDiv.style.display  = 'block';
    contentDiv.innerHTML = buildReport(meta, r1, r2, r3, r4, r5, eprText);
  } catch (err) {
    spinnerWrap.style.display = 'none';
    contentDiv.style.display  = 'block';
    contentDiv.innerHTML = `<div class="warn-box"><strong>Error processing files:</strong> ${esc(err.message)}<br><span style="font-size:12px;">Please check that the correct files were uploaded.</span></div>`;
  }
}

// ─────────────────────────────────────────────────────────────
// FILE READERS
// ─────────────────────────────────────────────────────────────
function readAsText(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = e => res(e.target.result);
    r.onerror = () => rej(new Error('Could not read ' + file.name));
    r.readAsText(file, 'UTF-8');
  });
}

async function readCertFile(file) {
  const ext = file.name.split('.').pop().toLowerCase();

  // ── PDF ──────────────────────────────────────────────────────
  if (ext === 'pdf') {
    // Use PDF.js (loaded via CDN in <head>) to extract all text
    const buf = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
    let fullText = '';
    for (let p = 1; p <= pdf.numPages; p++) {
      const page    = await pdf.getPage(p);
      const content = await page.getTextContent();
      fullText += content.items.map(i => i.str).join(' ') + '\n';
    }
    // PDFs with image-signatures have no extractable text for the sig,
    // so we check page count as a proxy (any valid PDF with pages = likely signed)
    return { text: fullText, imageCount: pdf.numPages > 0 ? 1 : 0 };
  }

  // ── DOCX / DOC (ZIP-based Office format) ─────────────────────
  const buf = await file.arrayBuffer();
  const zip  = await JSZip.loadAsync(buf);
  const xml  = await zip.file('word/document.xml').async('string');
  // Count embedded images
  const imageCount = (xml.match(/<a:blip\b/g) || []).length +
                     (xml.match(/<v:imagedata\b/g) || []).length;
  const text = xml
    .replace(/<[^>]+>/g, ' ')
    .replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>')
    .replace(/&quot;/g,'"').replace(/&apos;/g,"'")
    .replace(/\s+/g,' ');
  return { text, imageCount };
}

// ─────────────────────────────────────────────────────────────
// EXTRACT META
// ─────────────────────────────────────────────────────────────
function extractMeta(html) {
  const get = label => {
    const re = new RegExp(label + '[^<]*<\\/th>\\s*<td[^>]*>([^<]*)<\\/td>', 'i');
    const m  = html.match(re);
    return m ? m[1].trim() : '';
  };
  return {
    quoteId:    get('Quote ID:'),
    customer:   get('Name:'),
    country:    get('Country:'),
    quoteDate:  get('Creation date:'),
    status:     get('Status:'),
    bp:         get('BP company name:'),
    quoteTitle: get('Quote title:'),
  };
}

// ─────────────────────────────────────────────────────────────
// STEP 1 — BID TYPE  (Status = "On hold - VS offer")
// ─────────────────────────────────────────────────────────────
function validateBidType(html) {
  const required = 'On hold - VS offer';
  const re = /Status:\s*<\/th>\s*<td[^>]*>(.*?)<\/td>/i;
  const m  = html.match(re);
  const detected = m ? m[1].trim() : '(not found)';
  const pass = detected.toLowerCase() === required.toLowerCase();
  return { pass, detected, required };
}

// ─────────────────────────────────────────────────────────────
// STEP 2 — PROMOTION VALIDATION (name + 8% VS discount)
// ─────────────────────────────────────────────────────────────
function validatePromotion(html) {
  const expected = 'Power11 Sweep the floor Q4 2026';
  const re = new RegExp(expected.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'gi');
  const matches = html.match(re) || [];
  const promoFound = matches.length > 0;

  // Extract WWP11 entitlement rows and check Value = 8
  // HTML pattern: each row has Offer ID cell containing "WWP11" and
  // Value cell with headers containing "S11_entitlement_col_1_1_8"
  const discountRows = [];
  // Match each <tr> block in the entitlement table
  const rowRe = /<tr[^>]*>([\s\S]*?)<\/tr>/gi;
  let rowM;
  while ((rowM = rowRe.exec(html)) !== null) {
    const rowHtml = rowM[1];
    // Check row contains WWP11 offer ID
    if (!/WWP11/i.test(rowHtml)) continue;
    // Extract product (th text)
    const prodM = rowHtml.match(/<th[^>]*>\s*([^<\s][^<]*?)\s*<\/th>/i);
    const product = prodM ? prodM[1].trim() : '(unknown)';
    // Extract Value column (headers containing col_1_1_8)
    const valM = rowHtml.match(/headers="[^"]*col_1_1_8[^"]*"[^>]*>\s*([^<\s][^<]*?)\s*<\/td>/i);
    const value = valM ? valM[1].trim() : null;
    if (product && value !== null) {
      discountRows.push({ product, value, pass: value === '8' });
    }
  }

  const discountPass = discountRows.length > 0 && discountRows.every(r => r.pass);
  const pass = promoFound && discountPass;
  return { pass, promoFound, expected, occurrences: matches.length, discountRows, discountPass };
}

// ─────────────────────────────────────────────────────────────
// STEP 3 — POWER 11 CONFIG
// ─────────────────────────────────────────────────────────────
function validatePower11Config(html) {
  const identRe = /\b(\d{4})-([A-Z0-9]{2,3})\b/g;
  const seen = new Set();
  const found = [];
  let m;
  while ((m = identRe.exec(html)) !== null) {
    const id = m[1] + '-' + m[2];
    if (seen.has(id)) continue;
    seen.add(id);
    const hit = POWER11_ELIGIBLE.find(e =>
      e.type === m[1] && e.model.toUpperCase() === m[2].toUpperCase()
    );
    if (hit) found.push({ id, desc: hit.desc });
  }
  return { pass: found.length > 0, found };
}

// ─────────────────────────────────────────────────────────────
// STEP 4 — CERTIFICATION LETTER (full field validation)
// ─────────────────────────────────────────────────────────────
function validateCertLetter(text, eprMeta, imageCount) {
  imageCount = imageCount || 0;
  if (!text || text.trim().length < 20)
    return { pass: false, fields: [], machines: [], meta: {}, blankFields: ['Entire document is empty or unreadable'] };

  // Helper: extract a value after a label, stripping underscores/blanks
  const pick = re => {
    const m = text.match(re);
    return m ? m[1].trim().replace(/_{2,}/g,'').replace(/^\s*[-:]\s*/,'').trim() : '';
  };

  // ── Extract all cert letter fields ──────────────────────────
  const endUser      = pick(/End User Customer Name\s*[:\-_]*\s*(_{0,}[^\n_]{2,})/i);
  const address1     = pick(/Installed Address\s*[:\-_]*\s*(_{0,}[^\n_]{2,})/i);
  const address2     = pick(/_{5,}\s*\n[^A-Z\n]{0,10}(_{0,}[^\n_]{2,})/i) || '';
  const installedAddr= [address1, address2].filter(Boolean).join(' ').trim();
  const bpResellerName = pick(/IBM Business Partner Reseller Name\s*[:\-_]*\s*(_{0,}[^\n_]{2,})/i);
  const bpResellerCeid = pick(/IBM Business Partner Reseller CEID\s*[:\-_]*\s*(_{0,}[^\n_]{2,})/i);
  const distNameCeid   = pick(/Distributor Name\s*&?\s*CEID\s*[:\-_]*\s*([^\n_]{3,})/i);
  // Signature: check for text after the label OR an embedded image (ink/digital signatures are images in .docx)
  const sigBlock   = text.match(/Distributor Signature\s*[:\-_]*\s*([^\n]*)\s*Date\s*[:\-_]*/i);
  const sigTextPresent = sigBlock ? sigBlock[1].replace(/_{2,}/g,'').trim().length > 0 : false;
  const sigPresent = sigTextPresent || imageCount > 0;
  // Date: extract from "Date: ____" pattern
  const rawDate    = pick(/Date\s*[:\-_]+\s*(_{0,}[\d\/\-]{6,12})/i) ||
                     pick(/Date\s*[:\-_]+\s*_{0,}\s*([\d]{1,2}[\/\-][\d]{1,2}[\/\-][\d]{2,4})/i);
  const signatory  = pick(/Print Name and Title[^:]*:\s*(_{0,}[^\n_]{3,})/i);

  // ── Date range validation: Oct 1 – Dec 31 2026 ─────────────
  const DATE_MIN = new Date('2026-10-01');
  const DATE_MAX = new Date('2026-12-31T23:59:59');
  let datePass = false, dateParsed = null;
  if (rawDate) {
    // Support DD/MM/YYYY and MM/DD/YYYY
    const parts = rawDate.split(/[\/\-]/);
    if (parts.length === 3) {
      // Try DD/MM/YYYY first (European)
      const [a, b, c] = parts.map(Number);
      const tryDMY = new Date(c < 100 ? 2000+c : c, b-1, a);
      const tryMDY = new Date(c < 100 ? 2000+c : c, a-1, b);
      dateParsed = (!isNaN(tryDMY) && tryDMY >= DATE_MIN && tryDMY <= DATE_MAX) ? tryDMY :
                   (!isNaN(tryMDY) && tryMDY >= DATE_MIN && tryMDY <= DATE_MAX) ? tryMDY : tryDMY;
      datePass = (dateParsed >= DATE_MIN && dateParsed <= DATE_MAX);
    }
  }

  // ── Cross-check End User Name vs ePricer ───────────────────
  const eprCustomer = eprMeta ? eprMeta.customer : '';
  const endUserMatch = endUser && eprCustomer
    ? endUser.toLowerCase().includes(eprCustomer.toLowerCase().substring(0,6)) ||
      eprCustomer.toLowerCase().includes(endUser.toLowerCase().substring(0,6))
    : null; // null = can't compare (no ePricer data)

  // ── Extract machines ───────────────────────────────────────
  const machines = [];
  const blockMatch = text.match(/will be replaced are identified as follows\s*([\s\S]*?)The above listed/i);
  const searchIn = blockMatch ? blockMatch[1] : text;
  const lineRe = /\b(\d{4})\s+([A-Z0-9]{2,4})\s+([A-Z0-9]{4,10})\b/g;
  const seenM = new Set(); let lm;
  while ((lm = lineRe.exec(searchIn)) !== null) {
    const key = lm[1]+lm[2]+lm[3];
    if (!seenM.has(key)) { seenM.add(key); machines.push({ type: lm[1], model: lm[2], serial: lm[3] }); }
  }

  // ── Build field check rows ─────────────────────────────────
  // Each: { label, value, reference, pass, error }
  const fields = [
    {
      label: 'End User Customer Name',
      value: endUser,
      reference: 'End User Customer Name (ePricer)',
      pass: !!endUser,
      crossCheck: endUser && eprCustomer ? (endUserMatch ? '✓ Matches ePricer customer' : '⚠ Does not match ePricer customer: "'+eprCustomer+'"') : null,
      error: endUser ? null : 'Field is blank — End User Customer Name is required.',
    },
    {
      label: 'Installed Address',
      value: installedAddr,
      reference: 'End User Customer Address',
      pass: !!installedAddr,
      error: installedAddr ? null : 'Field is blank — Installed Address is required.',
    },
    {
      label: 'IBM Business Partner Reseller Name',
      value: bpResellerName,
      reference: 'Tier 2',
      pass: !!bpResellerName,
      error: bpResellerName ? null : 'Field is blank — BP Reseller Name is required.',
    },
    {
      label: 'IBM Business Partner Reseller CEID',
      value: bpResellerCeid,
      reference: 'Tier 2 CEID',
      pass: !!bpResellerCeid,
      error: bpResellerCeid ? null : 'Field is blank — BP Reseller CEID is required.',
    },
    {
      label: 'Machine Type to be Replaced',
      value: machines.length > 0 ? machines.map(m=>m.type+' '+m.model+' ('+m.serial+')').join('; ') : '',
      reference: 'Power 8, 9 and 10 Excel File',
      pass: machines.length > 0,
      error: machines.length > 0 ? null : 'No machine data found — at least one machine must be listed.',
    },
    {
      label: 'Distributor Name & CEID',
      value: distNameCeid,
      reference: 'Tier 1 and Tier 1 CEID',
      pass: !!distNameCeid,
      error: distNameCeid ? null : 'Field is blank — Distributor Name & CEID is required.',
    },
    {
      label: 'Distributor Signature',
      value: sigPresent ? (sigTextPresent ? '✓ Signature present (text)' : '✓ Signature present (image/ink)') : '(blank — no signature or image found)',
      reference: 'If there is a signature on the certification letter',
      pass: sigPresent,
      error: sigPresent ? null : 'No distributor signature found on the certification letter.',
    },
    {
      label: 'Date',
      value: rawDate || '(blank)',
      reference: 'Oct 1, 2026 – Dec 31, 2026',
      isDateField: true,
      pass: !!(rawDate && datePass),
      error: !rawDate ? 'Date is blank — a date is required.' :
             !datePass ? 'Date "'+rawDate+'" is outside the valid range (Oct 1 – Dec 31, 2026).' : null,
    },
    {
      label: 'Print Name and Title of Signatory',
      value: signatory,
      reference: 'If there is name and title indicated',
      pass: !!signatory,
      error: signatory ? null : 'Field is blank — Print Name and Title of Signatory is required.',
    },
  ];

  const blankFields = fields.filter(f => !f.pass).map(f => f.label);
  const pass = blankFields.length === 0;

  return {
    pass,
    fields,
    machines,
    blankFields,
    meta: { endUser, installedAddr, bpResellerName, bpResellerCeid, distNameCeid, sigPresent, rawDate, signatory },
  };
}

// ─────────────────────────────────────────────────────────────
// STEP 5 — LEGACY MACHINE ELIGIBILITY (uses hardcoded lists)
// ─────────────────────────────────────────────────────────────
function validateLegacyMachines(machines) {
  if (!machines || machines.length === 0)
    return { pass: false, reason: 'No machines from certification letter to validate.', rows: [] };

  const rows = machines.map(m => {
    const id  = (m.type + '-' + m.model).toUpperCase();
    const inP8  = P8_IDS.has(id);
    const inP9  = P9_IDS.has(id);
    const inP10 = P10_IDS.has(id);
    const foundIn = [...(inP8?['Power 8']:[]), ...(inP9?['Power 9']:[]), ...(inP10?['Power 10']:[])];
    const desc = legacyDesc(id);
    return { type: m.type, model: m.model, serial: m.serial, desc, foundIn, eligible: foundIn.length > 0 };
  });

  const pass = rows.every(r => r.eligible);
  const reason = pass ? '' :
    'The following machine(s) were not found in any Power 8/9/10 eligibility list: ' +
    rows.filter(r=>!r.eligible).map(r=>r.type+'-'+r.model).join(', ') + '.';
  return { pass, reason, rows };
}

// ─────────────────────────────────────────────────────────────
// BUILD REPORT HTML
// ─────────────────────────────────────────────────────────────
function buildReport(meta, r1, r2, r3, r4, r5, eprHtml) {
  const allPass = r1.pass && r2.pass && r3.pass && r4.pass && r5.pass;

  const failReasons = [];
  if (!r1.pass) failReasons.push(`<li><strong>Bid Type:</strong> Status detected as <em>"${esc(r1.detected)}"</em> — expected <em>"${esc(r1.required)}"</em>.</li>`);
  if (!r2.pass) {
    const reasons = [];
    if (!r2.promoFound) reasons.push(`"${esc(r2.expected)}" not found in the ePricer report`);
    if (!r2.discountPass) {
      if (r2.discountRows.length === 0) reasons.push('No WWP11 entitlement rows found — 8% VS discount not applied');
      else reasons.push('One or more WWP11 lines do not have Value = 8: ' + r2.discountRows.filter(r=>!r.pass).map(r=>r.product+' ('+r.value+')').join(', '));
    }
    failReasons.push(`<li><strong>Promotion Validation:</strong> ${reasons.join('; ')}.</li>`);
  }
  if (!r3.pass) failReasons.push(`<li><strong>Power 11 Configuration:</strong> No Power11 eligible machines found in the bid configuration.</li>`);
  if (!r4.pass) failReasons.push(`<li><strong>Certification Letter:</strong> ${(r4.blankFields||[]).length} field(s) failed — ${esc((r4.blankFields||[]).join(', '))}.</li>`);
  if (!r5.pass) failReasons.push(`<li><strong>Legacy Machine Eligibility:</strong> ${esc(r5.reason)}</li>`);

  // Power11 machines table
  const p11rows = r3.found.length
    ? r3.found.map(f=>`<tr><td><strong>${esc(f.id)}</strong></td><td>${esc(f.desc)}</td></tr>`).join('')
    : `<tr><td colspan="2" style="color:var(--muted);font-style:italic;text-align:center;">No Power11 eligible machines found</td></tr>`;

  // Legacy machines table
  const legacyRows = r5.rows.length
    ? r5.rows.map(r=>`<tr>
        <td>${esc(r.type)}</td><td>${esc(r.model)}</td><td>${esc(r.serial)}</td>
        <td>${esc(r.desc)}</td>
        <td>${r.eligible
          ? `<span class="badge badge-pass">${esc(r.foundIn.join(' / '))}</span>`

      </tr>`).join('')
    : `<tr><td colspan="5" style="color:var(--muted);font-style:italic;text-align:center;">No data</td></tr>`;

  // Summary checklist
  const checks = [
    { label:'Bid Type Validation',               pass:r1.pass, detail: r1.pass?`Status: "${esc(r1.detected)}"`:`Detected: "${esc(r1.detected)}" — Expected: "${esc(r1.required)}"` },
    { label:'Promotion Validation',               pass:r2.pass, detail: r2.pass
        ? `"${esc(r2.expected)}" found (${r2.occurrences}×); 8% VS discount on ${r2.discountRows.length} line(s)`
        : [!r2.promoFound?`"${esc(r2.expected)}" not found`:'', !r2.discountPass?'8% VS discount check failed':''].filter(Boolean).join('; ') },
    { label:'Power 11 Configuration Validation',  pass:r3.pass, detail: r3.pass?r3.found.map(f=>f.id+' ('+f.desc+')').join(', '):'No eligible machines found' },
    { label:'Certification Letter Validation',    pass:r4.pass, detail: r4.pass?`All ${(r4.fields||[]).length} fields present and valid`:(r4.blankFields||[]).length+' field(s) failed: '+(r4.blankFields||[]).join(', ') },
    { label:'Legacy Machine Eligibility Validation', pass:r5.pass, detail: r5.pass?'All machines found in Power 8/9/10 list':r5.reason },
  ];
  const checkHtml = checks.map(c=>`
    <li>
      <span class="ci">${c.pass?'✅':'❌'}</span>
      <span>
        <strong>${c.label}</strong> — <span class="${c.pass?'green':'red'}">${c.pass?'PASS':'FAIL'}</span><br>
        <span style="font-size:12px;color:var(--muted);">${c.detail}</span>
      </span>
    </li>`).join('');

  const now = new Date().toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});

  return `
  <!-- Meta -->
  <div class="result-section">
    <div class="result-header"><span class="result-title">📋 Quote Information</span><span style="font-size:11.5px;color:var(--muted);">Validated: ${now}</span></div>
    <div class="result-body" style="display:grid;grid-template-columns:1fr 1fr;gap:4px 24px;">
      <div class="field-row"><span class="field-lbl">Quote ID:</span><span class="field-val">${esc(meta.quoteId)}</span></div>
      <div class="field-row"><span class="field-lbl">Status:</span><span class="field-val">${esc(meta.status)}</span></div>
      <div class="field-row"><span class="field-lbl">Customer:</span><span class="field-val">${esc(meta.customer)}</span></div>
      <div class="field-row"><span class="field-lbl">Country:</span><span class="field-val">${esc(meta.country)}</span></div>
      <div class="field-row"><span class="field-lbl">Business Partner:</span><span class="field-val">${esc(meta.bp)}</span></div>
      <div class="field-row"><span class="field-lbl">Creation Date:</span><span class="field-val">${esc(meta.quoteDate)}</span></div>
    </div>
  </div>

  <!-- Step 1 -->
  <div class="result-section">
    <div class="result-header">
      <span class="result-title">1. Bid Type Validation</span>
      <span class="badge ${r1.pass?'badge-pass':'badge-fail'}">${r1.pass?'PASS':'FAIL'}</span>
    </div>
    <div class="result-body">
      <div class="field-row"><span class="field-lbl">Detected Value:</span><span class="field-val ${r1.pass?'green':'red'}">${esc(r1.detected)}</span></div>
      <div class="field-row"><span class="field-lbl">Expected Value:</span><span class="field-val">${esc(r1.required)}</span></div>
      <div class="field-row"><span class="field-lbl">Source:</span><span class="field-val" style="color:var(--muted);">Status field — ePricer Standard Report</span></div>
    </div>
  </div>

  <!-- Step 2 -->
  <div class="result-section">
    <div class="result-header">
      <span class="result-title">2. Promotion Validation</span>
      <span class="badge ${r2.pass?'badge-pass':'badge-fail'}">${r2.pass?'PASS':'FAIL'}</span>
    </div>
    <div class="result-body">
      <p style="color:var(--muted);margin-bottom:10px;font-size:12.5px;">Both sub-checks must PASS. The promotion name must appear in the report <strong>and</strong> every WWP11 line must carry an 8% Value Seller discount.</p>

      <div class="field-row" style="margin-bottom:8px;">
        <span class="field-lbl">2a. Promotion Name</span>
        <span class="field-val">
          <span class="${r2.promoFound?'green':'red'}">${r2.promoFound?'✓ Found — '+r2.occurrences+' occurrence(s)':'✗ Not found'}</span>
          <span style="color:var(--muted);font-size:12px;margin-left:8px;">Expected: "${esc(r2.expected)}"</span>
        </span>
      </div>

      <div class="field-row" style="margin-bottom:10px;">
        <span class="field-lbl">2b. 8% VS Discount</span>
        <span class="field-val">
          <span class="${r2.discountPass?'green':'red'}">${r2.discountPass?'✓ All WWP11 lines have Value = 8':'✗ Check failed'}</span>
          ${r2.discountRows.length===0?`<span style="color:var(--fail-fg);font-size:12px;margin-left:8px;">No WWP11 entitlement rows found</span>`:''}
        </span>
      </div>

      ${r2.discountRows.length>0?`
      <table class="res-table">
        <thead><tr><th>Product</th><th style="text-align:center;">Offer ID</th><th style="text-align:center;">Value (%)</th><th style="text-align:center;">Result</th></tr></thead>
        <tbody>
          ${r2.discountRows.map(row=>`
          <tr>
            <td><strong>${esc(row.product)}</strong></td>
            <td style="text-align:center;">WWP11</td>
            <td style="text-align:center;font-weight:700;color:${row.pass?'#166534':'#991b1b'};">${esc(row.value)}</td>
            <td style="text-align:center;"><span class="badge ${row.pass?'badge-pass':'badge-fail'}">${row.pass?'PASS':'FAIL'}</span></td>
          </tr>`).join('')}
        </tbody>
      </table>`:''}
    </div>
  </div>

  <!-- Step 3 -->
  <div class="result-section">
    <div class="result-header">
      <span class="result-title">3. Power 11 Configuration Validation</span>
      <span class="badge ${r3.pass?'badge-pass':'badge-fail'}">${r3.pass?'PASS':'FAIL'}</span>
    </div>
    <div class="result-body">
      <p style="color:var(--muted);margin-bottom:8px;">At least one machine in the bid must be on the Power11 Eligible Machine List.</p>
      <table class="res-table">
        <thead><tr><th>Machine ID (in Bid)</th><th>Power11 Description</th></tr></thead>
        <tbody>${p11rows}</tbody>
      </table>
    </div>
  </div>

  <!-- Step 4 -->
  <div class="result-section">
    <div class="result-header">
      <span class="result-title">4. Certification Letter Validation</span>
      <span class="badge ${r4.pass?'badge-pass':'badge-fail'}">${r4.pass?'PASS':'FAIL'}</span>
    </div>
    <div class="result-body">
      ${r4.pass
        ? `<div class="info-box">All required fields are present and valid. Certification letter passed all checks.</div>`
        : `<div class="warn-box"><strong>${(r4.blankFields||[]).length} field(s) failed validation.</strong> Each failed field is flagged below. All fields must be filled in and valid.</div>`}

      <table class="res-table" style="margin-top:12px;">
        <thead>
          <tr>
            <th style="min-width:220px;">Field</th>
            <th>Extracted Value</th>
            <th style="min-width:70px;text-align:center;">Result</th>
          </tr>
        </thead>
        <tbody>
          ${(r4.fields||[]).map(f=>`
          <tr>
            <td style="font-weight:600;">${esc(f.label)}</td>
            <td>
              ${f.isDateField
                ? `<span style="font-weight:500;">${esc(f.value)}</span>`
                : (f.value ? `<span style="color:${f.pass?'#166534':'#991b1b'};font-weight:500;">${esc(f.value)}</span>` : `<span style="color:#991b1b;font-style:italic;">(blank)</span>`)
              }
              ${f.crossCheck ? `<br><span style="font-size:11.5px;color:${f.crossCheck.startsWith('\u2713')?'#166534':'#92400e'};">${esc(f.crossCheck)}</span>` : ''}
              ${(!f.isDateField && f.error) ? `<br><span style="font-size:11.5px;color:#991b1b;">\u26A0 ${esc(f.error)}</span>` : ''}
            </td>
            <td style="text-align:center;">
              ${f.isDateField
                ? `<select id="date-override-select" class="date-select" onchange="updateDateOverride(this.value)">
                     <option value="pass"${f.pass?' selected':''}>PASS</option>
                     <option value="fail"${!f.pass?' selected':''}>FAIL</option>
                   </select>`
                : `<span class="badge ${f.pass?'badge-pass':'badge-fail'}">${f.pass?'PASS':'FAIL'}</span>`
              }
            </td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>
  </div>

  <!-- Step 5 -->
  <div class="result-section">
    <div class="result-header">
      <span class="result-title">5. Legacy Machine Eligibility Validation</span>
      <span class="badge ${r5.pass?'badge-pass':'badge-fail'}">${r5.pass?'PASS':'FAIL'}</span>
    </div>
    <div class="result-body">
      <p style="color:var(--muted);margin-bottom:8px;">All machines in the certification letter must appear in the Power 8, 9, or 10 eligibility list.</p>
      <table class="res-table">
        <thead><tr><th>Machine Type</th><th>Model</th><th>Serial #</th><th>Description</th><th>Found In</th></tr></thead>
        <tbody>${legacyRows}</tbody>
      </table>
      ${!r5.pass && r5.reason ? `<div class="warn-box" style="margin-top:10px;">${esc(r5.reason)}</div>` : ''}
    </div>
  </div>

  <!-- Summary -->
  <div class="result-section">
    <div class="result-header"><span class="result-title">Validation Summary</span></div>
    <div class="result-body"><ul class="checklist">${checkHtml}</ul></div>
  </div>

  <!-- Overall -->
  <div class="overall-box ${allPass?'pass':'fail'}">
    <div class="overall-title">OVERALL RESULT: <span class="badge ${allPass?'badge-pass':'badge-fail'}" style="font-size:13px;">${allPass?'PASS':'FAIL'}</span></div>
    <div class="overall-rec ${allPass?'pass-rec':'fail-rec'}">
      ${allPass?'Eligible for Power11 Sweep the Floor Q4 2026 Promotion':'Not Eligible for Power11 Sweep the Floor Q4 2026 Promotion'}
    </div>
    <div style="font-size:13px;color:var(--muted);">
      ${allPass?'All 5 validations PASS. The bid meets all requirements for the promotion.':
        failReasons.length+' validation(s) FAILED. All 5 must PASS for eligibility.'}
    </div>
    ${!allPass?`
    <div class="fail-reasons">
      <h4>Comments — Reasons for FAIL</h4>
      <ul>${failReasons.join('')}</ul>
    </div>`:`
    <div style="margin-top:12px;background:#fff;border:1px solid var(--pass-border);border-radius:5px;padding:10px 14px;font-size:13px;">
      <strong>All requirements satisfied:</strong>
      <ul style="padding-left:18px;margin-top:4px;line-height:1.8;">
        <li>Bid status confirmed as "On hold - VS offer"</li>
        <li>Promotion "Power11 Sweep the floor Q4 2026" (WWP11) applied to the bid</li>
        <li>Power11 eligible machine(s) present in bid configuration</li>
        <li>Signed Certification Letter on file with machine data extracted</li>
        <li>Legacy machine(s) verified against Power 8 / 9 / 10 eligibility list</li>
      </ul>
    </div>`}
  </div>

  <button class="reset-bottom-btn" onclick="resetAll()">↺ Start New Validation</button>

  <div class="page-footer">Made with IBM Bob</div>`;
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>
